# v07 模型网关：在线模式读环境变量，--fake 模式不需要。
# 主对话 demo；title 起标题用便宜模型；memory 抽取事实也用便宜模型
# （本体 TitleConfig.model_name / MemoryConfig 同款分模型思路）。
models:
  - name: demo
    display_name: 演示模型
    use: "langchain_openai:ChatOpenAI"   # 反射目标：module:attr
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.2
  - name: title
    display_name: 起标题专用（便宜快）
    use: "langchain_openai:ChatOpenAI"
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.0
  - name: memory
    display_name: 记忆抽取专用
    use: "langchain_openai:ChatOpenAI"
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.0
