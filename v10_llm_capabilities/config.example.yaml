# v10 配置：模型档案（含 thinking 开关的两支 kwargs）+ 工具分组声明。
# 在线模式读环境变量，--fake 模式不需要。
models:
  - name: demo
    display_name: 演示模型
    use: "langchain_openai:ChatOpenAI"   # 反射目标：module:attr
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.2
    supports_thinking: true
    # 本体 model_config.py 同款三支字段：开关打开/关闭各走一支 kwargs
    thinking:                            # when_thinking_enabled 的简写（本体同语义）
      extra_body: {thinking: {type: enabled, budget_tokens: 2048}}
    when_thinking_disabled:
      extra_body: {thinking: {type: disabled}}

# 工具即声明：先只暴露 default 组，其余组由 load_tools 按组放行
tools:
  - name: query_sales
    group: default
  - name: load_tools
    group: default
  - name: calculator
    group: math
  - name: word_count
    group: word
