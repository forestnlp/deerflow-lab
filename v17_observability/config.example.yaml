# v17 配置：模型（在线模式）+ 计费单价表
models:
  - name: demo
    display_name: 演示模型
    use: "langchain_openai:ChatOpenAI"   # 反射目标：module:attr
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.2

# 单价表（USD / 1K tokens）。report.py 与 main.py 都从这里读，绝不写死在代码里。
pricing:
  demo:
    per_1k_prompt: 0.15
    per_1k_completion: 0.60
