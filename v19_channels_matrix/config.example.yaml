# v19 渠道矩阵配置：channels 段声明启用哪些渠道及其参数
models:
  - name: demo
    display_name: 演示模型
    use: "langchain_openai:ChatOpenAI"   # 反射目标：module:attr
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.2

channels:
  - name: fakeim
    # script 由 main.py 注入（--fake 演示消息）
  - name: console
  - name: webhook
    token: "dfl-secret"
    endpoint: "https://fake.internal/hook"

# 故意配坏的渠道：给连通性自检演示"连不上要当场说，别等用户发现"
broken_channels:
  - name: webhook
    # 缺 token —— connect() 应失败
    endpoint: "https://fake.internal/hook"
