# v06 模型网关：在线模式读环境变量，--fake 模式不需要。
# 主 agent 用 demo，子代理合同里写的是 cheap（更便宜的模型，省预算）。
models:
  - name: demo
    display_name: 演示模型
    use: "langchain_openai:ChatOpenAI"   # 反射目标：module:attr
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.2
  - name: cheap
    display_name: 便宜模型（子代理专用）
    use: "langchain_openai:ChatOpenAI"
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.0
