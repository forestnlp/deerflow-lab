# v18 · 一份配置装出整个 agent：models / tools / middlewares 三段全部反射装配
# use 的语义与本体 reflection 一致："module:attr"。
# --fake 用 fake 条目（本地零件），在线用 demo 条目（$ENV 注入密钥）。

models:
  - name: fake
    display_name: 离线剧本模型（--fake 专用）
    use: "fake_model:make_script_model"
    model: scripted
    script: demo
  - name: demo
    display_name: 演示模型（在线）
    use: "langchain_openai:ChatOpenAI"
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.2

tools:
  - name: get_indicator
    use: "tools_business:get_indicator"
  - name: now
    use: "tools_business:now"
  - name: shout
    use: "tools_business:shout"

middlewares:
  - name: echo_usage
    use: "middlewares_demo:EchoUsageMiddleware"
    tag: usage
  - name: stamp
    use: "middlewares_demo:StampMiddleware"
    stamp: dfl-v18
