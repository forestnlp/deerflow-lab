# v16 配置：models 段在线模式读环境变量；mcp 段声明要 spawn 的 server
models:
  - name: demo
    display_name: 演示模型
    use: "langchain_openai:ChatOpenAI"   # 反射目标：module:attr
    model: Qwen3.8-Flash
    base_url: $DFL_BASE_URL
    api_key: $DFL_API_KEY
    temperature: 0.2

# 对应本体 config.yaml 的 mcp_servers 段（本体交 langchain-mcp-adapters 消费）
mcp_servers:
  - name: market-tools
    command: "python"
    args: ["server_market.py"]           # 相对本版目录的独立可执行文件
